version: 1
global:
  never_auto_merge: true
  max_global_concurrent_runs: 5
  max_runs_per_repo: 1
  max_runs_per_owner_team: 2
  max_daily_runs: 30
  retry_limit_per_task: 1
  max_critical_repo_runs: 1
allowed_task_types:
  - dependabot_shepherd
  - direct_security_patch
  - dependency_freshness_patch
  - repo_hygiene_scan
  - repo_hygiene_config_pr
  - ci_diagnosis
forbidden_paths:
  - "infra/prod/**"
  - "migrations/**"
  - "secrets/**"
  - ".github/workflows/deploy-prod.yml"
  - "**/*prod*.tf"
  - "**/billing/**"
  - "**/auth/**"
  - "**/crypto/**"
repo_criticality:
  standard:
    scheduled_runs: true
    required_reviews:
      - codeowners
      - repo_owner
  sensitive:
    scheduled_runs: true
    required_reviews:
      - codeowners
      - repo_owner
      - platform_security
  critical:
    scheduled_runs: true
    max_concurrent_runs: 1
    required_reviews:
      - codeowners
      - repo_owner
      - platform_security
      - senior_reviewer
task_policies:
  dependabot_shepherd:
    allowed_risk:
      - low
      - medium
      - high
    max_retries: 1
  direct_security_patch:
    allowed_risk:
      - low
      - medium
      - high
    require_advisory_reference: true
    max_retries: 1
  dependency_freshness_patch:
    allowed_risk:
      - low
    allowed_scopes:
      - devDependency
      - testDependency
      - patch
  ci_diagnosis:
    allowed_risk:
      - low
      - medium
    max_retries: 1
